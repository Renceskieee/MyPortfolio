<section class="contacts-page page-section">
  <div class="contact-heading reveal">
    <p class="eyebrow">Start a conversation</p>
    <h1>Let's make something<br /><em>meaningful.</em></h1>
    <p>
      Have an opportunity, a project idea, or simply want to connect? My inbox
      is always open.
    </p>
  </div>

  <div class="contact-layout">
    <div class="contact-details reveal">
      <a
        class="email-link"
        href="mailto:quiniano.infotech@gmail.com"
        aria-label="Email quiniano.infotech@gmail.com"
      >
        quiniano.<br />
        infotech@gmail.com
      </a>

      <div class="contact-info">
        <div class="mobile-contact">
          <small>Mobile number</small>
          <div class="mobile-number-row">
            <b>0994 608 5013</b>
            <button
              class="copy-button"
              type="button"
              data-copy="0994 608 5013"
              aria-label="Copy mobile number"
            >
              <img class="contact-icon" src="assets/icons/copy.svg" alt="" />
            </button>
          </div>
        </div>
        <p><small>Based in</small><b>Philippines</b></p>
      </div>

      <div class="social-links">
        <a
          href="https://web.facebook.com/xRency"
          target="_blank"
          rel="noopener"
          aria-label="Visit Laurence Quiniano on Facebook"
        >
          <img class="contact-icon" src="assets/icons/facebook.svg" alt="" />
          <span>Facebook</span>
        </a>
        <a
          href="https://www.instagram.com/renceskieee27/"
          target="_blank"
          rel="noopener"
          aria-label="Visit Laurence Quiniano on Instagram"
        >
          <img class="contact-icon" src="assets/icons/instagram.svg" alt="" />
          <span>Instagram</span>
        </a>
        <a
          href="https://www.youtube.com/@RencyQ"
          target="_blank"
          rel="noopener"
          aria-label="Visit Laurence Quiniano on YouTube"
        >
          <img class="contact-icon" src="assets/icons/youtube.svg" alt="" />
          <span>YouTube</span>
        </a>
      </div>
    </div>

    <form class="contact-form reveal">
      <label>
        Your name
        <input
          type="text"
          name="name"
          placeholder="How should I call you?"
          required
        />
      </label>
      <label>
        Email address
        <input
          type="email"
          name="email"
          placeholder="you@example.com"
          required
        />
      </label>
      <label>
        Message
        <textarea
          name="message"
          placeholder="Tell me a little about your project..."
          required
        ></textarea>
      </label>
      <button class="button button-primary" type="submit">
        Send message
        <svg
          class="send-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m21 3-8.5 18-2.2-7.3L3 11.5 21 3Z" />
          <path d="m10.3 13.7 4.2-4.2" />
        </svg>
      </button>
      <p class="form-status" aria-live="polite"></p>
    </form>
  </div>

  <div class="copy-toast" role="status" aria-live="polite">Mobile number copied</div>
</section>
